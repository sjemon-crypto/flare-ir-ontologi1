<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micro-SIM Ontologi | Hubungan Industri</title>
<style>
:root{--navy:#142b3d;--blue:#3167a4;--teal:#2f7e79;--gold:#c59737;--red:#b14343;--bg:#f4f7f9;--ink:#20262b;--muted:#687781;--white:#fff}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Aptos,Arial,sans-serif;background:linear-gradient(135deg,#eef4f7,#fff);color:var(--ink)}
.app{max-width:1050px;margin:auto;min-height:100vh;padding:22px}.top{display:flex;align-items:center;gap:16px;margin-bottom:18px}.brand{font-weight:800;color:var(--navy);white-space:nowrap}.progress{height:9px;background:#dfe7eb;border-radius:20px;flex:1;overflow:hidden}.bar{height:100%;background:var(--teal);width:0;transition:.3s}.counter{font-size:13px;color:var(--muted)}
.card{background:#fff;border-radius:22px;padding:30px;box-shadow:0 12px 40px #17344816;min-height:600px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}.title{font-size:clamp(28px,4vw,46px);line-height:1.08;color:var(--navy);margin:10px 0}.lead{font-size:20px;line-height:1.55;color:#41505a;max-width:850px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}.imgbox{background:var(--bg);border-radius:18px;padding:14px;text-align:center}.imgbox img{max-width:100%;max-height:360px;border-radius:12px;object-fit:contain}.choices{display:grid;gap:12px;margin:24px 0}.choice{border:2px solid #dce5ea;background:#fff;border-radius:14px;padding:16px 18px;text-align:left;font-size:17px;cursor:pointer;transition:.15s}.choice:hover{border-color:var(--blue);transform:translateY(-1px)}.choice.selected{border-color:var(--teal);background:#edf8f6}.choice.good{border-color:var(--teal);background:#eaf7f4}.choice.bad{border-color:var(--red);background:#fff0f0}.feedback{display:none;margin:18px 0;padding:18px;border-radius:14px;background:#edf5fb;border-left:5px solid var(--blue);line-height:1.55}.feedback.show{display:block}.btnrow{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#e9eff3;color:var(--navy)}.btn:disabled{opacity:.4;cursor:not-allowed}.quote{padding:18px;border-radius:14px;background:var(--bg);margin:12px 0;border-left:5px solid var(--gold)}.role{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}.quote p{font-size:18px;margin:7px 0}.concept{background:var(--navy);color:#fff;padding:24px;border-radius:18px;margin:22px 0}.concept h2{margin:0 0 8px;font-size:30px}.concept p{font-size:18px;line-height:1.55;color:#e6eef2}.flow{display:flex;gap:10px;align-items:stretch;margin:25px 0;flex-wrap:wrap}.step{flex:1;min-width:180px;padding:18px;border-radius:14px;background:var(--bg);text-align:center}.step b{display:block;color:var(--navy);margin-bottom:8px}.reflection{width:100%;min-height:120px;border:2px solid #dce5ea;border-radius:14px;padding:15px;font:inherit;font-size:17px}.small{font-size:14px;color:var(--muted)}.score{font-size:52px;font-weight:850;color:var(--teal)}.pill{display:inline-block;padding:6px 10px;background:#eaf7f4;color:var(--teal);border-radius:99px;font-weight:750;font-size:13px}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{padding:20px}.app{padding:12px}.top{flex-wrap:wrap}.progress{order:3;flex-basis:100%}}

.identity{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.field label{display:block;font-size:13px;font-weight:800;color:var(--navy);margin:0 0 6px}
.field input,.field select{width:100%;border:2px solid #dce5ea;border-radius:12px;padding:12px 13px;font:inherit;background:#fff}
.evidence{border:2px dashed #b9cbd5;background:#f8fbfc;border-radius:16px;padding:18px;margin:18px 0}
.evidence h3{margin:0 0 10px;color:var(--navy)}
.tag{display:inline-block;background:#eef4f7;color:var(--navy);border-radius:99px;padding:5px 9px;font-size:12px;font-weight:750;margin:3px}
.resultgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
.resultbox{background:var(--bg);border-radius:14px;padding:15px}
.resultbox b{display:block;color:var(--navy);font-size:13px;margin-bottom:5px}
@media(max-width:700px){.identity,.resultgrid{grid-template-columns:1fr}}
@media print{.top,.btnrow{display:none!important}.app{max-width:none;padding:0}.card{box-shadow:none;min-height:auto}.evidence{break-inside:avoid}}
</style>

const pages=[
()=>`<div class="eyebrow">FLARE-IR • Micro-SIM 01</div><h1 class="title">REALITI: Apa yang anda lihat?</h1><p class="lead">Aktiviti mikro 10–15 minit ini merekod <b>jejak penaakulan</b> anda: persepsi awal, keputusan konsep dan refleksi akhir. Tujuannya ialah melihat bagaimana pemikiran anda berkembang — bukan sekadar mendapatkan skor.</p><div class="evidence"><h3>🔒 Reka Bentuk Privasi</h3><p>Micro-SIM ini tidak meminta nama, nombor matrik atau kumpulan tutorial. Respons anda kekal pada peranti/pelayar anda dan tidak dihantar ke GitHub Pages.</p></div><div class="grid"><div class="imgbox"><img src="${dress}"></div><div class="imgbox"><img src="${duck}"></div></div><div class="concept"><h2>Cabaran anda</h2><p>Jangan cari definisi dahulu. Perhatikan, buat keputusan, dan fikirkan mengapa orang lain mungkin memberikan jawapan yang berbeza.</p></div><div class="evidence"><h3>📌 Bukti pembelajaran FLARE-IR</h3><span class="tag">Persepsi awal</span><span class="tag">Penaakulan ontologi</span><span class="tag">Aplikasi Hubungan Industri</span><span class="tag">Refleksi</span><p class="small">Pada akhir aktiviti, anda boleh memuat turun satu fail bukti (.txt) untuk dihantar melalui Moodle jika diarahkan oleh pensyarah.</p></div>${nav(false,true)}`,
()=>`<div class="eyebrow">Cetus • The Dress</div><h1 class="title">Apakah warna pakaian ini?</h1><div class="grid"><div class="imgbox"><img src="${dress}"></div><div><p class="lead">Pilih berdasarkan apa yang anda benar-benar lihat.</p><div class="choices"><button class="choice" onclick="pickPerception(this,'dress')">🔵 Biru + Hitam</button><button class="choice" onclick="pickPerception(this,'dress')">🟡 Putih + Emas</button></div><div class="feedback" id="fb">Menarik. Rakan anda mungkin melihat warna yang berbeza walaupun melihat imej yang sama.<br><br><b>Persoalan kita bukan sekadar “Siapa betul?”</b> tetapi: bagaimanakah kita menentukan apa yang dianggap sebagai realiti?</div></div></div>${nav(true,false)}`,
()=>`<div class="eyebrow">Cabaran • Duck–Rabbit</div><h1 class="title">Itik atau arnab?</h1><div class="grid"><div class="imgbox"><img src="${duck}"></div><div><p class="lead">Apakah yang anda lihat dahulu?</p><div class="choices"><button class="choice" onclick="pickPerception(this,'duck')">🦆 Itik</button><button class="choice" onclick="pickPerception(this,'duck')">🐇 Arnab</button><button class="choice" onclick="pickPerception(this,'duck')">↔️ Saya boleh melihat kedua-duanya</button></div><div class="feedback" id="fb">Imej tidak berubah, tetapi tafsiran kita boleh berubah. <b>Jadi, yang manakah realiti?</b></div></div></div>${nav(true,false)}`,
()=>`<div class="eyebrow">Konsep • Ontologi</div><h1 class="title">Apakah sifat realiti?</h1><div class="concept"><h2>ONTOLOGI</h2><p>Ontologi merujuk kepada andaian penyelidik tentang <b>apa yang wujud, apa yang dianggap nyata, dan apakah sifat realiti yang sedang dikaji.</b></p></div><div class="grid"><div class="step"><b>Satu / objektif?</b>Adakah realiti wujud secara bebas daripada tafsiran manusia?</div><div class="step"><b>Pelbagai / kontekstual?</b>Adakah realiti sosial dibentuk melalui pengalaman, tafsiran dan interaksi manusia?</div></div><p class="small"><b>Nota:</b> The Dress ialah fenomena persepsi visual. Di sini ia digunakan sebagai <i>analogi pedagogi</i>, bukan bukti bahawa semua realiti bersifat subjektif.</p>${nav(true,true)}`,
()=>`<div class="eyebrow">Aplikasi • Hubungan Industri</div><h1 class="title">Satu organisasi. Pelbagai realiti?</h1><p class="lead">Anda menyiasat dakwaan: <b>“Hubungan pekerja–pengurusan di organisasi ini adalah baik.”</b> Anda menemubual empat aktor.</p><div class="quote"><span class="role">Pengurus HR</span><p>“Hubungan kami sangat baik. Kami hampir tidak pernah menerima aduan.”</p></div><div class="quote"><span class="role">Penyelia</span><p>“Jarang berlaku konflik antara pekerja dan pengurusan.”</p></div><div class="quote"><span class="role">Pekerja</span><p>“Kami jarang mengadu kerana bimbang akan menjejaskan pekerjaan.”</p></div><div class="quote"><span class="role">Wakil Kesatuan</span><p>“Ketiadaan aduan tidak bermaksud pekerja berpuas hati.”</p></div>${nav(true,true)}`,
()=>`<div class="eyebrow">Keputusan Penyelidik</div><h1 class="title">Apakah kesimpulan awal anda?</h1><div class="choices" id="quiz"><button class="choice" onclick="quiz(this,false,'q1')">A. Pengurus HR mempunyai gambaran paling tepat kerana beliau mewakili organisasi.</button><button class="choice" onclick="quiz(this,false,'q1')">B. Pekerja mempunyai satu-satunya realiti sebenar kerana mereka mengalami keadaan tersebut.</button><button class="choice" onclick="quiz(this,false,'q1')">C. Salah seorang daripada mereka pasti memberikan maklumat yang tidak benar.</button><button class="choice" onclick="quiz(this,true,'q1')">D. Aktor yang berbeza mungkin mengalami dan mentafsir realiti organisasi secara berbeza.</button></div><div class="feedback" id="fb"></div>${nav(true,false)}`,
()=>`<div class="eyebrow">Bezakan Realiti</div><h1 class="title">Yang manakah lebih dekat kepada realiti sosial yang ditafsirkan?</h1><div class="choices"><button class="choice" onclick="quiz(this,false,'q2')">A. Gaji asas pekerja ialah RM2,500 berdasarkan rekod penggajian.</button><button class="choice" onclick="quiz(this,true,'q2')">B. Pekerja merasakan layanan pengurusan tidak adil walaupun prosedur rasmi digunakan kepada semua.</button></div><div class="feedback" id="fb"></div>${nav(true,false)}`,
()=>`<div class="eyebrow">Kes Akhir • Suara Pekerja</div><h1 class="title">Daripada ontologi kepada soalan penyelidikan</h1><div class="quote"><span class="role">Pengurus</span><p>“Tiada konflik di tempat kerja kami.”</p></div><div class="quote"><span class="role">Pekerja</span><p>“Kami tidak bersuara kerana takut.”</p></div><p class="lead">Sebagai penyelidik kualitatif, soalan manakah paling sesuai?</p><div class="choices"><button class="choice" onclick="quiz(this,false,'q3')">A. Berapakah bilangan konflik yang direkodkan pada tahun ini?</button><button class="choice" onclick="quiz(this,false,'q3')">B. Adakah pengurus benar atau pekerja benar?</button><button class="choice" onclick="quiz(this,true,'q3')">C. Bagaimanakah pekerja dan pengurusan mentafsir serta mengalami konflik dan suara pekerja dalam organisasi?</button><button class="choice" onclick="quiz(this,false,'q3')">D. Adakah organisasi ini mempunyai polisi aduan rasmi?</button></div><div class="feedback" id="fb"></div>${nav(true,false)}`,
()=>`<div class="eyebrow">Refleksi • 1 Minit</div><h1 class="title">Lengkapkan pemikiran anda</h1><p class="lead">Dalam 1–2 ayat, jelaskan mengapa <b>ketiadaan aduan pekerja</b> tidak semestinya membuktikan bahawa hubungan industri adalah harmoni.</p><textarea class="reflection" id="reflection" oninput="captureReflection()" placeholder="Tulis refleksi anda di sini...">${esc(evidence.reflection)}</textarea><p class="small">Respons ini tidak dinilai secara automatik. Tujuannya ialah menjadikan anda menyatakan andaian tentang realiti dengan kata-kata sendiri.</p>${nav(true,true)}`,
()=>`<div class="eyebrow">Rumusan • Rekod Pembelajaran</div><span class="pill">Misi selesai</span><h1 class="title">Anda baru sahaja berfikir seperti penyelidik kualitatif.</h1><div class="score">${score}/3</div><p class="lead">Skor cabaran konsep anda. Yang lebih penting ialah alasan di sebalik pilihan anda.</p><div class="concept"><h2>ONTOLOGI = Apakah realiti?</h2><p>Dalam pendekatan konstruktivis dan interpretivis, realiti sosial boleh bersifat <b>pelbagai, kontekstual</b> dan dibentuk melalui pengalaman serta interaksi manusia. Satu tempat kerja tidak semestinya menghasilkan satu realiti sosial yang sama bagi semua aktor.</p></div><div class="flow"><div class="step"><b>ONTOLOGI</b>Apakah realiti?</div><div class="step"><b>EPISTEMOLOGI</b>Bagaimanakah kita mengetahuinya?</div><div class="step"><b>METODOLOGI</b>Bagaimanakah kajian dirancang?</div><div class="step"><b>KAEDAH</b>Bagaimanakah data diperoleh dan dianalisis?</div></div><div class="evidence"><h3>Rekod Eviden Individu</h3><div class="resultgrid"><div class="resultbox"><b>Privasi</b>Tiada nama atau nombor matrik direkodkan.</div><div class="resultbox"><b>Status</b>Formatif • tanpa markah</div></div><b>Refleksi akhir</b><p>${esc(evidence.reflection)||'<i>Tiada refleksi direkodkan.</i>'}</p></div><p class="lead"><b>Misi seterusnya:</b> Jika realiti boleh dialami secara berbeza, bagaimanakah penyelidik boleh mengetahuinya?</p><div class="btnrow"><button class="btn secondary" onclick="restart()">Ulang Micro-SIM</button><button class="btn secondary" onclick="printResult()">Cetak / PDF</button><button class="btn primary" onclick="downloadEvidence()">Muat Turun Eviden Anonim (.txt)</button></div>`
];
function nav(back,next){return `<div class="btnrow">${back?'<button class="btn secondary" onclick="prev()">← Kembali</button>':'<span></span>'}${next?'<button class="btn primary" onclick="next()">Seterusnya →</button>':'<button class="btn primary" id="nextBtn" disabled onclick="next()">Seterusnya →</button>'}</div>`}
function render(){document.getElementById('stage').innerHTML=pages[page]();document.getElementById('bar').style.width=((page+1)/pages.length*100)+'%';document.getElementById('counter').textContent=(page+1)+' / '+pages.length;window.scrollTo({top:0,behavior:'smooth'})}
function next(){captureIdentity();captureReflection();if(page<pages.length-1){page++;render()}} function prev(){captureIdentity();captureReflection();if(page>0){page--;render()}}
function pickPerception(el,key){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');answered[key]=true;evidence[key]=el.innerText.trim();saveLocal();document.getElementById('fb').classList.add('show');document.getElementById('nextBtn').disabled=false}
function quiz(el,correct,key){if(answered[key])return;answered[key]=true;evidence[key]=el.innerText.trim()+(correct?' [TEPAT]':' [BELUM TEPAT]');document.querySelectorAll('.choice').forEach(x=>x.disabled=true);el.classList.add(correct?'good':'bad');if(correct)score++;saveLocal();let fb=document.getElementById('fb');fb.innerHTML=correct?'<b>✓ Tepat.</b> Dalam penyelidikan kualitatif, khususnya perspektif konstruktivis/interpretivis, aktor yang berbeza boleh mengalami dan memberi makna yang berbeza terhadap fenomena sosial yang sama.':'<b>Belum tepat.</b> Cuba fikir dari sudut ontologi: perbezaan perspektif tidak semestinya bermaksud seseorang berbohong atau hanya satu aktor memiliki realiti sosial yang sah.';fb.classList.add('show');document.getElementById('nextBtn').disabled=false}
function restart(){page=0;score=0;answered={};evidence={started:new Date().toISOString(),dress:'',duck:'',q1:'',q2:'',q3:'',reflection:''};saveLocal();render()}
function printResult(){captureReflection();window.print()}
